name: CI & Packaging Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test and Build on Windows 11
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run Test Suite (44 Tests)
        run: |
          python -m unittest discover -s disk_investigator/tests -v

      - name: Package Standalone Executable
        run: |
          python build_exe.py

      - name: Verify Executable Functionality
        run: |
          .\disk_investigator.exe --version
          .\disk_investigator.exe doctor
