name: CI & Packaging Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test, Build & Release on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Assert Version Consistency
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $initVersion = (Get-Content disk_investigator/__init__.py | Select-String '__version__\s*=\s*["'']([^"'']+)["'']').Matches.Groups[1].Value
          Write-Host "Tag Version: $tagVersion | Init Version: $initVersion"
          if ($tagVersion -ne $initVersion) {
            Write-Error "Version Mismatch! Tag $tagVersion does not match disk_investigator/__init__.py ($initVersion)"
            exit 1
          }

      - name: Package Standalone CLI (disk_investigator.exe)
        run: |
          python build_exe.py

      - name: Run Full Test Suite
        run: |
          python -m unittest discover -s disk_investigator/tests -v

      - name: Package 1-Click Setup EXE (disk-investigator-setup.exe)
        run: |
          python build_installer.py

      - name: Package Standalone Uninstaller EXE (disk-investigator-uninstall.exe)
        run: |
          python build_uninstaller.py

      - name: Verify Executable Functionality & Smoke Tests
        run: |
          .\disk_investigator.exe --version
          .\disk_investigator.exe doctor
          .\disk_investigator.exe discover-capabilities
          .\disk_investigator.exe investigate . --compact
          .\disk_investigator.exe cleanup-plan . --compact
          .\disk-investigator-setup.exe --version
          .\disk-investigator-setup.exe --help
          .\disk-investigator-uninstall.exe --version
          .\disk-investigator-uninstall.exe --help

      - name: Generate Cryptographic SHA-256 Manifest
        shell: pwsh
        run: |
          $setupHash = (Get-FileHash -Algorithm SHA256 .\disk-investigator-setup.exe).Hash.ToLower()
          $uninstHash = (Get-FileHash -Algorithm SHA256 .\disk-investigator-uninstall.exe).Hash.ToLower()
          $cliHash = (Get-FileHash -Algorithm SHA256 .\disk_investigator.exe).Hash.ToLower()
          "$setupHash  disk-investigator-setup.exe`n$uninstHash  disk-investigator-uninstall.exe`n$cliHash  disk_investigator.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release (Tag Triggers Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            disk-investigator-setup.exe
            disk-investigator-uninstall.exe
            disk_investigator.exe
            SHA256SUMS.txt
          generate_release_notes: true
