name: CI & Packaging Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test, Build & Release on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run Full Test Suite (59 Tests)
        run: |
          python -m unittest discover -s disk_investigator/tests -v

      - name: Package Standalone CLI (disk_investigator.exe)
        run: |
          python build_exe.py

      - name: Package 1-Click Setup EXE (disk-investigator-setup.exe)
        run: |
          python build_installer.py

      - name: Verify Executable Functionality
        run: |
          .\disk_investigator.exe --version
          .\disk_investigator.exe doctor
          .\disk-investigator-setup.exe --help

      - name: Generate Cryptographic SHA-256 Manifest
        shell: pwsh
        run: |
          $setupHash = (Get-FileHash -Algorithm SHA256 .\disk-investigator-setup.exe).Hash.ToLower()
          $cliHash = (Get-FileHash -Algorithm SHA256 .\disk_investigator.exe).Hash.ToLower()
          "$setupHash  disk-investigator-setup.exe`n$cliHash  disk_investigator.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release (Tag Triggers Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            disk-investigator-setup.exe
            disk_investigator.exe
            SHA256SUMS.txt
          generate_release_notes: true
